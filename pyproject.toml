[project]
name = "fonti"
version = "0.1.0.dev0"
description = "Local-first RAG for Italian documents with verifiable citations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ricky Kubler" }]
requires-python = ">=3.12"
keywords = ["rag", "retrieval", "italian", "citations", "local-first", "ocr"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: Italian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "platformdirs>=4.12.3",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "snowballstemmer>=3.1.1",
]

# Local models need torch: pick exactly one of `cpu` and `gpu`; add `docling` for scanned PDFs,
# tables and .docx (e.g. `uv sync --extra gpu --extra docling`).
[project.optional-dependencies]
cpu = ["sentence-transformers>=5.0", "torch>=2.14", "torchvision>=0.29"]
gpu = ["sentence-transformers>=5.0", "torch>=2.14", "torchvision>=0.29"]
docling = ["docling[easyocr]>=2.133"]

[project.scripts]
fonti = "fonti.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
# Italian typography used on purpose in user-facing text.
allowed-confusables = ["›", "’", "‘", "–", "«", "»"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "reportlab.*", "snowballstemmer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow"]
markers = ["slow: needs real models, Docling or a running Ollama; run locally with `-m slow`"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.0.1",
    "ruff>=0.16.10",
]

[project]
name = "fonti"
version = "0.1.0.dev0"
description = "Local-first RAG for Italian documents with verifiable citations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ricky Kubler" }]
requires-python = ">=3.12"
keywords = ["rag", "retrieval", "italian", "citations", "local-first", "ocr"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: Italian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.scripts]
fonti = "fonti.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow"]
markers = ["slow: needs real models, Docling or a running Ollama; run locally with `-m slow`"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

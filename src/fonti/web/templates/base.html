<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fonti{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">fonti</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Domande</a>
      <a href="/documents" {% if request.url.path.startswith('/documents') %}aria-current="page"{% endif %}>Documenti</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Risposte generate sul tuo computer a partire dai tuoi documenti. Controlla sempre le fonti
    citate: non è una consulenza legale. · fonti {{ version }}
  </footer>
</body>
</html>
